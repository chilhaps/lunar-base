version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    volumes:
      - ./:/usr/src/app
      - ../lunar-tear:/usr/src/lunar-tear
      - ../lunar-scripts:/usr/src/lunar-scripts:ro
    environment:
      PYTHONUNBUFFERED: "1"
    command: uvicorn web.app:app --host 0.0.0.0 --port 8888

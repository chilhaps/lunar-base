version: '3.9'

services:
  lunar-base:
    build:
      context: ..
      dockerfile: lunar-base/Dockerfile
    container_name: lunar-base
    ports:
      - "8888:8888"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./tools:/app/tools
      - ../lunar-tear:/lunar-tear
    environment:
      - PYTHONUNBUFFERED=1
      - LUNAR_TEAR_DIR=/lunar-tear
      - LUNAR_TEAR_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

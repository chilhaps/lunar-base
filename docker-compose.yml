version: '3.9'

services:
  lunar-base:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lunar-base
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
      - ./tools:/app/tools
      - ./web:/app/web
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
